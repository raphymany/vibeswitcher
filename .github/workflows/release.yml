name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish VibeSwitcher/VibeSwitcher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Get-Item publish/VibeSwitcher.exe).VersionInfo.ProductVersion
          if (-not $ver.StartsWith($tag)) {
            throw "Tag $tag does not match the exe version $ver — bump <Version> in VibeSwitcher.csproj before tagging."
          }

      - name: Zip artifact
        run: Compress-Archive -Path publish -DestinationPath VibeSwitcher-${{ github.ref_name }}-win-x64.zip

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\VibeSwitcher.iss
          Move-Item installer\output\VibeSwitcher-Setup.exe "VibeSwitcher-Setup-${{ github.ref_name }}-win-x64.exe"

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @(
            "VibeSwitcher-${{ github.ref_name }}-win-x64.zip",
            "VibeSwitcher-Setup-${{ github.ref_name }}-win-x64.exe"
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $f"
          }
          $lines | Out-File -Encoding utf8 sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VibeSwitcher-Setup-${{ github.ref_name }}-win-x64.exe
            VibeSwitcher-${{ github.ref_name }}-win-x64.zip
            sha256sums.txt
          generate_release_notes: true
