name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish VibeSwitcher/VibeSwitcher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/

      - name: Zip artifact
        run: Compress-Archive -Path publish -DestinationPath VibeSwitcher-${{ github.ref_name }}-win-x64.zip

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "VibeSwitcher-${{ github.ref_name }}-win-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  VibeSwitcher-${{ github.ref_name }}-win-x64.zip" | Out-File -Encoding utf8 sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VibeSwitcher-${{ github.ref_name }}-win-x64.zip
            sha256sums.txt
          generate_release_notes: true
