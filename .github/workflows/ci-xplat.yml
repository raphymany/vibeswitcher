name: CI (macOS + Linux app)

# Builds and tests the cross-platform app in xplat/ on every OS it supports. It also runs when the
# Windows app's sources change, because xplat/ links many of those files — a Windows-side change can
# break (or need porting to) the macOS/Linux app, and this makes that visible on the Windows PR.
# xplat/dev is the holding branch the Mac/Linux phases merge into until the first version ships to main.
on:
  push:
    branches: [ main, xplat/dev ]
    paths: [ 'xplat/**', 'VibeSwitcher/**', 'VibeSwitcher.Tests/**', '.github/workflows/ci-xplat.yml' ]
  pull_request:
    branches: [ main, xplat/dev ]
    paths: [ 'xplat/**', 'VibeSwitcher/**', 'VibeSwitcher.Tests/**', '.github/workflows/ci-xplat.yml' ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = Apple Silicon, macos-15-intel = Intel.
        os: [ ubuntu-24.04, macos-15, macos-15-intel, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: xplat/global.json

      - name: Build
        working-directory: xplat
        run: dotnet build VibeSwitcher.XPlat.sln -c Release

      - name: Test
        working-directory: xplat
        run: dotnet test VibeSwitcher.XPlat.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Keep the screenshots
        # Every dialog in light and dark, with the Linux and macOS frames, as this OS renders them (on
        # Linux they're also checked against the saved baselines). For reviewing the look.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: xplat/tests/VibeSwitcher.App.Tests/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

      - name: Desktop-bus tests (Linux)
        # Notifications and Wayland global shortcuts against stand-in desktop services (a notification
        # server, the Global Shortcuts portal) on a real, private D-Bus session.
        if: runner.os == 'Linux'
        working-directory: xplat
        run: |
          command -v dbus-run-session >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q dbus-bin dbus-daemon; }
          VS_DBUS_IT=1 dbus-run-session -- dotnet test tests/VibeSwitcher.Platform.Linux.Tests/VibeSwitcher.Platform.Linux.Tests.csproj -c Release --no-build --filter "Category=DBus" --logger "console;verbosity=normal"

  linux-audio:
    # The Linux audio engine against real sound servers: what modern distros run (PipeWire), classic
    # PulseAudio, and Ubuntu 22.04 with pactl's text output forced (what pactl before 15.99 prints).
    name: Linux audio (${{ matrix.server }}${{ matrix.text == '1' && ', text output' || '' }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, server: pipewire,   text: "0", packages: "pipewire pipewire-pulse wireplumber pulseaudio-utils dbus" }
          - { os: ubuntu-24.04, server: pulseaudio, text: "0", packages: "pulseaudio pulseaudio-utils" }
          - { os: ubuntu-22.04, server: pulseaudio, text: "1", packages: "pulseaudio pulseaudio-utils" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VS_PACTL_TEXT: ${{ matrix.text }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: xplat/global.json

      - name: Install sound server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ${{ matrix.packages }}

      - name: Integration tests
        working-directory: xplat
        run: |
          if [ "${{ matrix.server }}" = pipewire ]; then
            dbus-run-session -- bash scripts/run-linux-audio-tests.sh pipewire
          else
            bash scripts/run-linux-audio-tests.sh pulseaudio
          fi

  macos-audio:
    # The macOS audio engine (real Core Audio) and global hotkeys (real Carbon), on Apple Silicon and Intel. BlackHole is a free
    # virtual audio driver: each device is an output and an input that loops back, so a played tone
    # can be measured.
    name: macOS audio + hotkeys (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: xplat/global.json

      - name: Install BlackHole virtual audio devices
        run: |
          brew install --cask blackhole-2ch blackhole-16ch
          sudo killall coreaudiod || true
          for _ in $(seq 1 30); do
            system_profiler SPAudioDataType 2>/dev/null | grep -q "BlackHole 16ch" && break
            sleep 2
          done
          system_profiler SPAudioDataType | grep -E "^\s+[A-Za-z].*:$" || true

      - name: Microphone permission (diagnostics)
        # Audio input on macOS needs the microphone permission; without it the input is silent, not an error.
        run: |
          for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "== $db"
            sudo sqlite3 "$db" "select client, auth_value from access where service='kTCCServiceMicrophone'" 2>&1 || true
          done

      - name: Integration tests (audio, hotkeys)
        working-directory: xplat
        env:
          VS_MAC_AUDIO_IT: "1"
          VS_MAC_IT: "1"
        run: dotnet test tests/VibeSwitcher.Platform.MacOS.Tests/VibeSwitcher.Platform.MacOS.Tests.csproj --filter "Category=MacAudio|Category=MacOS" --logger "console;verbosity=normal"

  linux-desktop:
    # Desktop integration: global hotkeys grabbed for real on a virtual X server and pressed with
    # xdotool, and the older-GNOME shortcut fallback against GNOME's real settings tool and schemas.
    name: Linux desktop (X11, GNOME shortcuts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: xplat/global.json

      - name: Install a virtual X server and GNOME's keyboard-shortcut settings
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth xdotool libx11-6 libx11-xcb1 libxcb1 \
            libglib2.0-bin gnome-settings-daemon-common

      - name: Integration tests
        working-directory: xplat
        # (The GNOME tests write to a throwaway settings file, never a real desktop's settings.)
        run: VS_X11_IT=1 VS_GSETTINGS_IT=1 xvfb-run -a dotnet test tests/VibeSwitcher.Platform.Linux.Tests/VibeSwitcher.Platform.Linux.Tests.csproj --filter "Category=X11|Category=Gnome" --logger "console;verbosity=normal"

  packages-linux:
    # The .deb and the AppImage, built from a self-contained publish, then installed / run.
    name: Packages (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APPIMAGETOOL_VERSION: "1.9.0"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: xplat/global.json

      - name: Get appimagetool
        # The standard AppImage builder, pinned (it fetches the matching AppImage runtime itself).
        # (It checks the desktop file with desktop-file-validate, which the runner lacks.)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q desktop-file-utils
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Build
        run: bash xplat/packaging/linux/build-linux.sh out

      - name: Install the .deb and start the app
        # "Started" = still running after 15 s on a virtual screen (timeout's exit code 124): that
        # needs every library the window loads, which --version alone doesn't.
        run: |
          sudo apt-get install -y -q xvfb ./out/*.deb
          vibeswitcher --version
          # (liblttng-ust is optional: .NET only uses it for tracing when it's there.)
          if ldd /opt/vibeswitcher/VibeSwitcher /opt/vibeswitcher/*.so | grep "not found" | grep -v liblttng-ust; then exit 1; fi
          rc=0; xvfb-run -a timeout 15 vibeswitcher || rc=$?; test "$rc" -eq 124
          # The friend-test tools: the self-test runs (its result isn't judged: a runner has no sound
          # devices), and the diagnostics zip has the report and pictures of the windows.
          # (The self-test may report problems — no sound devices — but must run to the end.)
          vibeswitcher --selftest > "$RUNNER_TEMP/selftest.txt" || true
          cat "$RUNNER_TEMP/selftest.txt"
          grep -q "Settings folder" "$RUNNER_TEMP/selftest.txt"
          timeout 180 xvfb-run -a vibeswitcher --diagnostics "$RUNNER_TEMP/diag.zip"
          unzip -l "$RUNNER_TEMP/diag.zip" | grep -q report.txt
          unzip -l "$RUNNER_TEMP/diag.zip" | grep -q screenshots/settings-profiles.png
          dpkg -L vibeswitcher | grep -q /usr/lib/udev/rules.d/70-vibeswitcher-headsets.rules
          dpkg -L vibeswitcher | grep -q /usr/share/applications/com.raphymany.vibeswitcher.desktop
          desktop-file-validate /usr/share/applications/com.raphymany.vibeswitcher.desktop
          sudo apt-get remove -y -q vibeswitcher
          test ! -e /usr/lib/udev/rules.d/70-vibeswitcher-headsets.rules

      - name: Start the AppImage
        run: |
          chmod +x out/*.AppImage
          out/*.AppImage --appimage-extract-and-run --version
          rc=0; xvfb-run -a timeout 15 out/*.AppImage --appimage-extract-and-run || rc=$?; test "$rc" -eq 124

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            out/*.deb
            out/*.AppImage
          if-no-files-found: error

  packages-linux-distros:
    # The .deb installed and started on the other Linux versions it's meant for (its library
    # dependencies are named differently on each).
    name: Package on ${{ matrix.image }}
    needs: packages-linux
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:26.04"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Get the packages
        uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: out

      - name: Install the .deb and start the app
        run: |
          apt-get update -q
          apt-get install -y -q xvfb xauth unzip ./out/*.deb
          vibeswitcher --version
          # (liblttng-ust is optional: .NET only uses it for tracing when it's there.)
          if ldd /opt/vibeswitcher/VibeSwitcher /opt/vibeswitcher/*.so | grep "not found" | grep -v liblttng-ust; then exit 1; fi
          rc=0; xvfb-run -a timeout 15 vibeswitcher || rc=$?; test "$rc" -eq 124
          # The friend-test tools: the self-test runs (its result isn't judged: a runner has no sound
          # devices), and the diagnostics zip has the report and pictures of the windows.
          # (The self-test may report problems — no sound devices — but must run to the end.)
          vibeswitcher --selftest > "$RUNNER_TEMP/selftest.txt" || true
          cat "$RUNNER_TEMP/selftest.txt"
          grep -q "Settings folder" "$RUNNER_TEMP/selftest.txt"
          timeout 180 xvfb-run -a vibeswitcher --diagnostics "$RUNNER_TEMP/diag.zip"
          unzip -l "$RUNNER_TEMP/diag.zip" | grep -q report.txt
          unzip -l "$RUNNER_TEMP/diag.zip" | grep -q screenshots/settings-profiles.png

  packages-mac:
    # VibeSwitcher.app in a .dmg for each Mac architecture, built natively, then opened and started.
    name: Packages (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: xplat/global.json

      - name: Build
        run: bash xplat/packaging/macos/build-macos.sh ${{ matrix.rid }} out

      - name: Open the .dmg and start the app from it
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/vs" out/*.dmg
          app="$RUNNER_TEMP/vs/VibeSwitcher.app"
          "$app/Contents/MacOS/VibeSwitcher" --version
          # Started = still running after 15 s (that needs every library the window loads).
          "$app/Contents/MacOS/VibeSwitcher" & pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"; wait "$pid" || true
          # The menu-bar item, pressed as a user would: the app's styled menu must open under it.
          check="$RUNNER_TEMP/menubar.txt"
          VS_MENUBAR_CHECK="$check" "$app/Contents/MacOS/VibeSwitcher" & pid=$!
          for i in $(seq 1 40); do [ -f "$check" ] && break; sleep 1; done
          cat "$check"; echo
          grep -q "^menu opened" "$check"
          wait "$pid" || true
          # The friend-test tools (see the Linux job).
          "$app/Contents/MacOS/VibeSwitcher" --selftest > "$RUNNER_TEMP/selftest.txt" || true
          cat "$RUNNER_TEMP/selftest.txt"
          grep -q "Settings folder" "$RUNNER_TEMP/selftest.txt"
          "$app/Contents/MacOS/VibeSwitcher" --diagnostics "$RUNNER_TEMP/diag.zip"
          unzip -l "$RUNNER_TEMP/diag.zip" | grep -q report.txt
          unzip -l "$RUNNER_TEMP/diag.zip" | grep -q screenshots/settings-profiles.png
          codesign --verify --deep --strict "$app"
          plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist" | grep -qx com.raphymany.vibeswitcher
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/VibeSwitcher.icns"
          hdiutil detach "$RUNNER_TEMP/vs"

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.rid }}
          path: out/*.dmg
          if-no-files-found: error

  ui-parity:
    # The look side by side: each ported dialog as the Windows app draws it (rendered by the Windows
    # app itself, via xplat/tools/WpfSnapshots) next to the macOS/Linux app's versions. For review —
    # download the "ui-parity" artifact and open parity.html.
    name: Look vs Windows (side by side)
    # The Linux and macOS images are the ones those systems rendered in build-and-test.
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build the Windows app
        # With its own SDK (the repo root's global.json), exactly as its own CI builds it.
        run: dotnet build VibeSwitcher/VibeSwitcher.csproj -c Release

      - name: Get the Linux screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-ubuntu-24.04
          path: shots/linux

      - name: Get the macOS screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-macos-15
          path: shots/mac

      - name: Windows renders and the side-by-side page
        working-directory: xplat
        run: dotnet run --project tools/WpfSnapshots -c Release -- ../ui-parity ../shots/linux ../shots/mac

      - name: Keep the page
        uses: actions/upload-artifact@v4
        with:
          name: ui-parity
          path: ui-parity/
          if-no-files-found: error

  fork-drift:
    name: Forked files in sync with Windows originals
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check forks
        run: bash xplat/scripts/check-forks.sh
