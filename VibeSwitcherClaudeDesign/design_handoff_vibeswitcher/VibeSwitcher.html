<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeSwitcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;}
body{background:#0d0d12;font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#e4e4ef;-webkit-font-smoothing:antialiased;overflow:hidden;}

:root{
  --orange:#f5820a;--orange-dim:rgba(245,130,10,.12);--orange-border:rgba(245,130,10,.25);--orange-glow:rgba(245,130,10,.07);
  --bg:#0d0d12;--surface:#16161e;--surface-2:#1e1e28;--surface-3:#242432;
  --border:#222234;--border-h:#363650;
  --text:#e4e4ef;--text-dim:#7878a0;--text-muted:#38384e;
  --green:#2dca72;--blue:#4aa8ff;--mint:#30d278;--purple:#9b69ff;--red:#e05555;
  --r-card:14px;--r-btn:7px;
}

/* ── SPLASH ── */
.vs-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:14px;z-index:200;}
.vs-splash--exit{animation:splashOut .45s ease forwards;}
@keyframes splashOut{to{opacity:0;transform:scale(1.04);}}

.vs-splash__icon{cursor:pointer;border-radius:22px;box-shadow:0 8px 32px rgba(0,0,0,.55),0 0 0 1px rgba(245,130,10,.1);transition:box-shadow .2s;}
.vs-splash__icon:hover{box-shadow:0 12px 44px rgba(0,0,0,.65),0 0 0 1px rgba(245,130,10,.28),0 0 56px rgba(245,130,10,.08);}
/* splash icon: no whole-icon animation — V + bars animate independently in app.jsx */
.vs-splash__name{font-size:26px;font-weight:700;letter-spacing:-.5px;color:var(--text);margin-top:6px;}
.vs-splash__tagline{font-size:12.5px;color:var(--text-muted);}
@keyframes breathe{0%,100%{opacity:.4;}50%{opacity:1;}}

/* ── Card entrance stagger ── */
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.vs-card,.vs-card--add{animation:cardIn .38s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--card-i,0) * 55ms);}

/* ── Panel slide-in ── */
@keyframes panelIn{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:translateX(0);}}
.vs-panel{animation:panelIn .52s cubic-bezier(.22,1,.36,1) both;}

/* ── Add card pulse ── */
@keyframes addPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,130,10,0);}50%{box-shadow:0 0 0 5px rgba(245,130,10,.07);}}
.vs-card--add{animation:addPulse 3s ease-in-out infinite,cardIn .38s cubic-bezier(.22,1,.36,1) backwards;animation-delay:0ms,calc(var(--card-i,0) * 55ms);}

/* ── APP SHELL ── */
.vs-app{display:flex;flex-direction:column;height:100vh;overflow:hidden;animation:appIn .35s ease;}
@keyframes appIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ── TITLE BAR ── */
.vs-titlebar{height:30px;background:#09090e;display:flex;align-items:center;padding:0 14px;gap:7px;flex-shrink:0;border-bottom:1px solid #16162a;user-select:none;}
.vs-titlebar__text{font-size:11.5px;color:#44445a;font-weight:500;}
.vs-titlebar__controls{margin-left:auto;display:flex;}
.vs-titlebar__btn{width:44px;height:30px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#555570;font-size:10px;transition:background .12s,color .12s;}
.vs-titlebar__btn:hover{background:rgba(255,255,255,.05);color:#aaaacc;}
.vs-titlebar__btn--close:hover{background:#c42b1c;color:#fff;}

/* ── TOP NAV ── */
.vs-nav{height:54px;background:#10101a;border-bottom:1px solid #1c1c2c;display:flex;align-items:center;padding:0 18px;gap:9px;flex-shrink:0;}
.vs-nav__logo{display:flex;align-items:center;gap:9px;cursor:pointer;margin-right:4px;text-decoration:none;}
.vs-nav__logo-text{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.3px;}
.vs-nav__logo-text span{color:var(--orange);}
.vs-nav__div{width:1px;height:22px;background:#1e1e30;flex-shrink:0;}
.vs-nav__search{display:flex;align-items:center;gap:7px;background:#12121c;border:1px solid #1e1e30;border-radius:8px;padding:0 11px;height:32px;flex:1;max-width:260px;transition:border-color .15s;}
.vs-nav__search:focus-within{border-color:var(--orange-border);}
.vs-nav__search input{background:none;border:none;outline:none;font:13px/1 'Inter',system-ui;color:var(--text);width:100%;}
.vs-nav__search input::placeholder{color:#2a2a40;}
.vs-nav__search svg{color:#2a2a40;flex-shrink:0;}
.vs-nav__filter{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;background:none;border:1px solid #1e1e30;color:var(--text-dim);font:12.5px/1 'Inter',system-ui;cursor:pointer;transition:all .15s;white-space:nowrap;}
.vs-nav__filter:hover,.vs-nav__filter.on{border-color:var(--orange-border);color:var(--orange);background:var(--orange-glow);}
.vs-nav__badge{background:var(--orange);color:#000;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;}
.vs-nav__spacer{flex:1;}
.vs-nav__btn{width:34px;height:34px;border-radius:8px;background:none;border:1px solid transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.vs-nav__btn:hover{background:#1c1c28;border-color:#282840;color:var(--text-dim);}
.vs-nav__btn.on{background:var(--orange-glow);border-color:var(--orange-border);color:var(--orange);}
.vs-nav__add{display:flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;background:var(--orange);border:none;color:#0d0d12;font:600 12.5px/1 'Inter',system-ui;cursor:pointer;transition:background .15s;white-space:nowrap;}
.vs-nav__add:hover{background:#e07409;}

/* ── FILTER BAR ── */
.vs-filters{background:var(--bg);border-bottom:1px solid #181826;padding:0 18px;display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0;max-height:0;overflow:hidden;opacity:0;transition:max-height .3s ease,opacity .25s ease,padding .3s ease;}
.vs-filters.on{max-height:90px;opacity:1;padding-top:9px;padding-bottom:9px;}
.vs-fchip{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;border:1px solid #1e1e30;background:none;color:var(--text-muted);font:11.5px/1 'Inter',system-ui;cursor:pointer;transition:all .15s;white-space:nowrap;}
.vs-fchip:hover{border-color:#303048;color:var(--text-dim);background:#16162a;}
.vs-fchip.on{border-color:var(--orange-border);color:var(--orange);background:var(--orange-glow);}
.vs-fchip--clear{color:#e05555;border-color:#2a1818;}
.vs-fchip--clear:hover{background:rgba(224,85,85,.08);border-color:rgba(224,85,85,.3);color:#e05555;}

/* ── MAIN ── */
.vs-main{flex:1;overflow-y:auto;background:var(--bg);background-image:radial-gradient(circle,rgba(255,255,255,.015) 1px,transparent 0);background-size:28px 28px;scroll-behavior:smooth;}
.vs-main::-webkit-scrollbar{width:5px;}
.vs-main::-webkit-scrollbar-thumb{background:#1e1e30;border-radius:3px;}
.vs-grid-wrap{padding:22px 18px;}
.vs-grid-hdr{display:flex;align-items:center;gap:9px;margin-bottom:16px;}
.vs-grid-lbl{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;}
.vs-grid-cnt{font-size:10.5px;color:var(--text-muted);background:#14141e;border:1px solid #1e1e30;padding:1px 7px;border-radius:10px;}

/* ── GRID ── */
.vs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(192px,1fr));gap:13px;}

/* ── CARD ── */
.vs-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);display:flex;flex-direction:column;align-items:center;padding:20px 14px 14px;gap:7px;cursor:pointer;user-select:none;height:244px;overflow:hidden;transition:border-color .15s,background .15s,box-shadow .15s;}
.vs-card:hover{border-color:var(--border-h);background:var(--surface-2);box-shadow:0 6px 24px rgba(0,0,0,.4);}
.vs-card--active{border-color:rgba(245,130,10,.38)!important;background:linear-gradient(180deg,#221408 0%,#1a1510 35%,var(--surface) 70%);}
.vs-card--active:hover{border-color:rgba(245,130,10,.5)!important;}
.vs-card__bar{position:absolute;top:0;left:12px;right:12px;height:2px;border-radius:0 0 2px 2px;background:linear-gradient(90deg,transparent,var(--orange),transparent);}
@keyframes cardPress{0%{transform:scale(1);}40%{transform:scale(.93);}100%{transform:scale(1);}}
.vs-card--clicking{animation:cardPress .22s ease forwards;}

.vs-card__ico{width:76px;height:76px;border-radius:17px;background:#1c1c2a;border:1px solid #282838;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;transition:border-color .15s,box-shadow .15s;}
.vs-card:hover .vs-card__ico{border-color:var(--border-h);}
.vs-card--active .vs-card__ico{border-color:rgba(245,130,10,.28);box-shadow:0 0 18px rgba(245,130,10,.1);}

.vs-card__name{font-size:13.5px;font-weight:600;color:var(--text);text-align:center;line-height:1.3;text-wrap:pretty;}
.vs-badge{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2.5px 8px;border-radius:10px;}
.vs-badge--both{background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange-border);}
.vs-badge--pb{background:rgba(74,168,255,.1);color:var(--blue);border:1px solid rgba(74,168,255,.2);}
.vs-badge--rec{background:rgba(48,210,120,.1);color:var(--mint);border:1px solid rgba(48,210,120,.2);}

.vs-card__devs{display:flex;flex-direction:column;gap:3px;width:100%;overflow:hidden;}
.vs-card__dev{display:flex;align-items:center;gap:4px;min-width:0;}
.vs-card__devdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.vs-card__devdot--pb{background:var(--blue);}
.vs-card__devdot--rec{background:var(--mint);}
.vs-card__dev span:last-child{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.vs-card__foot{margin-top:auto;display:flex;align-items:center;gap:5px;}
.vsdot{width:6px;height:6px;border-radius:50%;}
.vsdot--g{background:var(--green);box-shadow:0 0 6px rgba(45,202,114,.5);}
.vsdot--o{background:var(--orange);}
.vsdot--b{background:var(--blue);}
.vs-hk{font:10px/1 'Courier New',monospace;color:#353550;padding:1px 5px;border-radius:4px;background:#131320;border:1px solid #222234;}

/* ── CARD ACTIONS (hover) ── */
.vs-card__acts{position:absolute;bottom:0;left:0;right:0;padding:6px 8px 8px;background:linear-gradient(to top,rgba(12,12,18,.98) 65%,transparent);display:flex;gap:3px;justify-content:center;flex-wrap:wrap;opacity:0;transform:translateY(3px);transition:opacity .18s,transform .18s;pointer-events:none;}
.vs-card:hover .vs-card__acts{opacity:1;transform:translateY(0);pointer-events:auto;}
.vs-act{width:28px;height:28px;border-radius:6px;border:1px solid #282840;background:#1a1a28;color:#484868;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;position:relative;}
.vs-act:hover{background:#222236;border-color:#383858;color:#a0a0c8;}
.vs-act--on{background:var(--orange-dim);border-color:var(--orange-border);color:var(--orange);}
.vs-act--activated{background:rgba(45,202,114,.1);border-color:rgba(45,202,114,.28);color:var(--green);}
.vs-act--del:hover{background:rgba(224,85,85,.1);border-color:rgba(224,85,85,.22);color:#e06060;}
.vs-act::after{content:attr(title);position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);background:#22223a;border:1px solid #363650;color:var(--text);font-size:10.5px;padding:3px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20;}
.vs-act:hover::after{opacity:1;}

/* ── ADD CARD ── */
.vs-card--add{border:1.5px dashed #1e1e30;color:var(--text-muted);font-size:12.5px;font-weight:500;justify-content:center;gap:10px;height:244px;}
.vs-card--add:hover{border-color:rgba(245,130,10,.35);background:rgba(245,130,10,.03);color:rgba(245,130,10,.6);}

/* ── MODAL ── */
.vs-overlay{position:fixed;inset:0;background:rgba(5,5,10,.84);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:ovIn .2s ease;}
@keyframes ovIn{from{opacity:0;}to{opacity:1;}}
.vs-modal{background:#17171f;border:1px solid rgba(245,130,10,.16);border-radius:18px;width:100%;max-width:480px;max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 30px 100px rgba(0,0,0,.78);animation:mdIn .32s cubic-bezier(.34,1.4,.64,1);}
@keyframes mdIn{from{opacity:0;transform:scale(.88) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
.vs-modal::-webkit-scrollbar{width:4px;}
.vs-modal::-webkit-scrollbar-thumb{background:#282840;border-radius:2px;}
.vs-modal__hdr{display:flex;align-items:flex-start;gap:14px;padding:22px 22px 16px;border-bottom:1px solid #1e1e2c;}
.vs-modal__ico{width:54px;height:54px;border-radius:13px;background:#1c1c2a;border:1px solid #282838;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.vs-modal__title-area{flex:1;}
.vs-modal__name{background:none;border:none;outline:none;font:700 16px/1.2 'Inter',system-ui;color:var(--text);width:100%;margin-bottom:10px;padding:2px 0;border-bottom:1px solid transparent;transition:border-color .15s;}
.vs-modal__name:focus{border-bottom-color:var(--orange-border);}
.vs-modal__modes{display:flex;gap:6px;}
.vs-mpill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid #262640;background:none;color:var(--text-muted);cursor:pointer;transition:all .13s;}
.vs-mpill:hover:not(.on){border-color:var(--border-h);color:var(--text-dim);}
.vs-mpill--both.on{border-color:var(--orange-border);background:var(--orange-dim);color:var(--orange);}
.vs-mpill--pb.on{border-color:rgba(74,168,255,.3);background:rgba(74,168,255,.1);color:var(--blue);}
.vs-mpill--rec.on{border-color:rgba(48,210,120,.3);background:rgba(48,210,120,.1);color:var(--mint);}
.vs-modal__x{width:30px;height:30px;border-radius:7px;background:none;border:1px solid transparent;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .13s;}
.vs-modal__x:hover{background:#222234;border-color:#363650;color:var(--text);}
.vs-modal__body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
.vs-frow{display:flex;flex-direction:column;gap:6px;}
.vs-flabel{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:5px;}
.vs-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.vs-dot--pb{background:var(--blue);}
.vs-dot--rec{background:var(--mint);}
.vs-fi{background:#101018;border:1px solid #1e1e30;border-radius:8px;color:var(--text);font:13px/1.4 'Inter',system-ui;padding:9px 12px;width:100%;transition:border-color .15s;}
.vs-fi:focus{outline:none;border-color:var(--orange-border);}
.vs-fi::placeholder{color:var(--text-muted);}
textarea.vs-fi{resize:none;}
select.vs-fi{appearance:none;cursor:pointer;}
.vs-devrow{display:flex;gap:8px;align-items:center;}
.vs-devrow .vs-fi{flex:1;}
.vs-icrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px;flex:1;}
.vs-ipick{width:42px;height:42px;border-radius:10px;background:#1a1a26;border:1px solid #282838;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;overflow:hidden;padding:5px;}
.vs-ipick:hover{border-color:#363650;background:#202032;}
.vs-ipick.on{border-color:var(--orange-border);background:var(--orange-dim);}
.vs-modal__ftr{padding:14px 22px 20px;border-top:1px solid #1e1e2c;display:flex;justify-content:flex-end;gap:8px;}

/* ── BUTTONS ── */
.vs-btn{padding:8px 16px;border-radius:var(--r-btn);font:500 13px/1 'Inter',system-ui;cursor:pointer;border:none;transition:all .13s;}
.vs-btn--pri{background:var(--orange);color:#0d0d12;font-weight:600;}
.vs-btn--pri:hover{background:#e07409;}
.vs-btn--sec{background:#1e1e2a;color:var(--text-dim);border:1px solid #2a2a3a;}
.vs-btn--sec:hover{background:#252538;color:var(--text);border-color:#363650;}
.vs-btn--sm{padding:6px 12px;font-size:12px;flex-shrink:0;}

/* ── SETTINGS PANEL ── */
.vs-panel{padding:26px 24px;max-width:640px;margin:0 auto;}
.vs-panel__hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid #1e1e2c;}
.vs-panel__back{width:34px;height:34px;border-radius:8px;background:#1c1c28;border:1px solid #282838;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;}
.vs-panel__back:hover{background:#242438;color:var(--text);}
.vs-panel__title{font-size:18px;font-weight:700;color:var(--text);}
.vs-sec{margin-bottom:22px;}
.vs-sec__title{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px;padding:0 2px;}
.vs-sec__body{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.vs-row{display:flex;align-items:center;padding:11px 16px;gap:12px;border-bottom:1px solid #1a1a28;}
.vs-row:last-child{border-bottom:none;}
.vs-row__lbl{font-size:13px;color:var(--text-dim);flex:1;display:flex;align-items:center;gap:5px;}
.vs-row__info{font-size:10.5px;color:var(--text-muted);cursor:help;}
.vs-toggle{width:38px;height:21px;border-radius:11px;background:#252540;border:1px solid #363650;cursor:pointer;padding:2px;transition:all .2s;position:relative;flex-shrink:0;}
.vs-toggle.on{background:var(--orange);border-color:var(--orange);}
.vs-toggle__th{display:block;width:15px;height:15px;border-radius:50%;background:#5858788;transition:transform .2s,background .2s;}
.vs-toggle.on .vs-toggle__th{transform:translateX(17px);background:#fff;}
.vs-theme-picker{display:flex;gap:4px;}
.vs-theme-btn{padding:5px 12px;border-radius:7px;border:1px solid #262640;background:none;color:var(--text-muted);font:12px/1 'Inter',system-ui;cursor:pointer;transition:all .13s;}
.vs-theme-btn:hover{border-color:#363650;color:var(--text-dim);background:#1c1c28;}
.vs-theme-btn.on{border-color:var(--orange-border);background:var(--orange-dim);color:var(--orange);}
.vs-hkrow{display:flex;align-items:center;padding:10px 16px;gap:12px;border-bottom:1px solid #1a1a28;}
.vs-hkrow:last-child{border-bottom:none;}
.vs-hkrow__lbl{font-size:13px;color:var(--text-dim);flex:1;}
.vs-hkval{font:11.5px/1 'Courier New',monospace;color:var(--text-muted);background:#101018;border:1px solid #1e1e30;padding:4px 10px;border-radius:6px;min-width:60px;text-align:center;}
.vs-panel__ftr{margin-top:22px;padding-top:18px;border-top:1px solid #1e1e2c;display:flex;gap:8px;}

/* ── ABOUT ── */
.vs-about{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 20px;text-align:center;}
.vs-about__name{font-size:20px;font-weight:700;color:var(--text);}
.vs-about__ver{font-size:12px;color:var(--text-muted);}
.vs-about__desc{font-size:13px;color:var(--text-dim);max-width:320px;line-height:1.65;margin:8px 0;}
.vs-about__links{display:flex;gap:16px;}
.vs-alink{font-size:12.5px;color:var(--orange);text-decoration:none;}
.vs-alink:hover{text-decoration:underline;}

/* ── FAQ ── */
.vs-faq{display:flex;flex-direction:column;}
.vs-faq__item{border-bottom:1px solid #1a1a28;}
.vs-faq__item:last-child{border-bottom:none;}
.vs-faq__q{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:none;border:none;cursor:pointer;color:var(--text-dim);font:13px/1.4 'Inter',system-ui;text-align:left;gap:12px;transition:color .13s;}
.vs-faq__q:hover{color:var(--text);}
.vs-faq__item.open .vs-faq__q{color:var(--orange);}
.vs-faq__a{padding:0 16px 13px;font-size:12.5px;color:var(--text-muted);line-height:1.65;}
</style>
